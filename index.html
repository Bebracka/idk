
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>СТЕНА ИДЕЙ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
    header { background: #e0e0e0; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
    #controls { display: flex; justify-content: space-between; padding: 10px 20px; }
    #addNoteBtn { padding: 10px 16px; border: none; background: #ccc; border-radius: 6px; cursor: pointer; }
    #searchInput { padding: 10px; width: 200px; border-radius: 6px; border: 1px solid #ccc; }
    #board { display: flex; gap: 10px; padding: 20px; overflow-x: auto; }
    .note { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); width: 200px; min-height: 80px; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>СТЕНА ИДЕЙ</header>
  <div id="controls">
    <button id="addNoteBtn">Добавить идею</button>
    <input type="text" id="searchInput" placeholder="Поиск..." />
  </div>
  <div id="board"></div>

  <script>
    const firebaseConfig = {
      apiKey: "ВСТАВЬ_СЮДА",
      authDomain: "ВСТАВЬ_СЮДА",
      databaseURL: "ВСТАВЬ_СЮДА",
      projectId: "ВСТАВЬ_СЮДА",
      storageBucket: "ВСТАВЬ_СЮДА",
      messagingSenderId: "ВСТАВЬ_СЮДА",
      appId: "ВСТАВЬ_СЮДА"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const board = document.getElementById("board");
    const addBtn = document.getElementById("addNoteBtn");
    const search = document.getElementById("searchInput");
    let notes = [];

    function addNote(content = "Новая идея...") {
      const note = document.createElement("div");
      note.className = "note";
      note.contentEditable = true;
      note.innerText = content;
      note.addEventListener("blur", () => {
        db.ref("ideas").push({ text: note.innerText, time: Date.now() });
      });
      board.appendChild(note);
      notes.push(note);
    }

    function searchNotes() {
      const val = search.value.toLowerCase();
      notes.forEach(n => {
        n.style.display = n.innerText.toLowerCase().includes(val) ? "block" : "none";
      });
    }

    addBtn.onclick = () => addNote();
    search.oninput = searchNotes;
    for (let i = 0; i < 3; i++) addNote();
  </script>
</body>
</html>
