
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Стена Идей — BubonPrivet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      overflow-x: hidden;
    }
    header {
      background: #e0e0e0;
      color: #333;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
    }
    #board {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      min-height: 300px;
    }
    .note {
      background: #ffffff;
      padding: 15px;
      margin: 10px;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
      cursor: move;
      width: 200px;
      min-height: 80px;
    }
    .panel {
      background: #ffffff;
      padding: 20px;
      border-top: 1px solid #ddd;
    }
    .panel h2 {
      color: #666;
    }
    .tool {
      margin-bottom: 20px;
    }
    .tool button {
      padding: 8px 16px;
      background: #cccccc;
      color: #222;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }
    .tool p {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
      min-height: 40px;
    }
    #addNoteBtn {
      margin: 20px;
      display: block;
      padding: 12px 20px;
      background: #d0d0d0;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .hidden-link {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
    }
    #easter1 { top: 10px; left: 10px; }
    #easter2 { top: 50px; right: 15px; }
    #easter3 { bottom: 40px; left: 40%; }
    #easter4 { bottom: 5px; right: 5px; }
  </style>
</head>
<body>

<header>СТЕНА ИДЕЙ + ПАНЕЛЬ ГЕНИЯ</header>

<button id="addNoteBtn" onclick="addNote()">Добавить идею</button>

<div id="board"></div>

<div class="panel">
  <h2>Панель Гения</h2>

  <div class="tool">
    <strong>Задача дня:</strong>
    <p id="taskOutput">...</p>
    <button onclick="genTask()">Генерировать</button>
  </div>

  <div class="tool">
    <strong>Фокус-внимание:</strong>
    <p id="focusOutput">...</p>
    <button onclick="genFocus()">Генерировать</button>
  </div>

  <div class="tool">
    <strong>Мысль дня:</strong>
    <p id="quoteOutput">...</p>
    <button onclick="genQuote()">Генерировать</button>
  </div>
</div>

<a href="book.html" class="hidden-link" id="easter1"></a>
<a href="bot.html" class="hidden-link" id="easter2"></a>
<a href="dictator.html" class="hidden-link" id="easter3"></a>
<a href="mad.html" class="hidden-link" id="easter4"></a>

<script>
  function addNote() {
    const note = document.createElement("div");
    note.className = "note";
    note.contentEditable = true;
    note.innerText = "Новая идея...";
    document.getElementById("board").appendChild(note);
  }

  function genTask() {
    const tasks = [
      "Придумай задачу на тему 'внимание'",
      "Составь логическую головоломку",
      "Опиши задачу, которую решил недавно",
      "Создай упражнение для памяти"
    ];
    document.getElementById("taskOutput").innerText =
      tasks[Math.floor(Math.random() * tasks.length)];
  }

  function genFocus() {
    const focus = [
      "Смотри в одну точку 30 секунд",
      "Прочитай 3 предложения и перескажи",
      "Заметь 5 новых вещей вокруг",
      "Послушай тишину 1 минуту"
    ];
    document.getElementById("focusOutput").innerText =
      focus[Math.floor(Math.random() * focus.length)];
  }

  function genQuote() {
    const quotes = [
      "Смысл не в смысле, а в движении к нему.",
      "Мышление — это игра с правилами, которых ты сам не знал.",
      "Каждая идея — это дверь. Открой.",
      "Твоя сила — в наблюдении. Начни с этого."
    ];
    document.getElementById("quoteOutput").innerText =
      quotes[Math.floor(Math.random() * quotes.length)];
  }

  window.onload = () => {
    for (let i = 0; i < 2; i++) addNote();
  };
</script>

</body>
</html>
