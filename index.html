
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бомба Браузер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <button onclick="goHome()">Домой</button>
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <input type="text" id="urlInput" placeholder="Введите адрес или запрос...">
    <button onclick="loadURL()">Перейти</button>
    <button onclick="clearHistory()">🧹</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <iframe id="browserFrame" src="https://example.com"></iframe>

  <script src="script.js"></script>
</body>
</html>
