<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бомба Браузер</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: url("cat.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .browser-bar {
      margin-top: 40px;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .browser-bar input {
      padding: 8px 12px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .browser-bar button {
      padding: 8px 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #555;
      color: white;
      cursor: pointer;
    }

    .browser-bar button:hover {
      background-color: #333;
    }

    .title {
      margin-top: 20px;
      font-size: 32px;
      color: #fff;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 10px;
    }

    .footer {
      margin-top: auto;
      padding: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="title">Бомба Браузер</div>
  <div class="browser-bar">
    <input type="text" id="url" placeholder="Введите адрес, например google.com">
    <button onclick="goToSite()">Перейти</button>
  </div>
  <div class="footer">Создан с любовью и котом</div>

  <script>
    function goToSite() {
      let input = document.getElementById("url").value.trim();
      if (!input.startsWith("http://") && !input.startsWith("https://")) {
        input = "https://" + input;
      }
      window.open(input, "_blank");
    }
  </script>
</body>
</html>
