
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>СТЕНА ИДЕЙ — BubonPrivet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      overflow-x: hidden;
    }
    header {
      background: #e0e0e0;
      color: #333;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
    }
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 20px;
      gap: 15px;
    }
    #addNoteBtn {
      padding: 10px 16px;
      background: #d0d0d0;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 15px;
    }
    #searchInput {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 220px;
    }
    #board {
      display: flex;
      overflow-x: auto;
      padding: 20px;
      min-height: 200px;
      gap: 10px;
    }
    .note {
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
      cursor: move;
      width: 200px;
      min-height: 80px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>СТЕНА ИДЕЙ</header>

<div id="controls">
  <button id="addNoteBtn" onclick="addNote()">Добавить идею</button>
  <input type="text" id="searchInput" placeholder="Поиск по идеям..." oninput="searchNotes()">
</div>

<div id="board"></div>

<script>
  const notes = [];

  function addNote(content = "Новая идея...") {
    const note = document.createElement("div");
    note.className = "note";
    note.contentEditable = true;
    note.innerText = content;
    document.getElementById("board").appendChild(note);
    notes.push(note);
  }

  function searchNotes() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    notes.forEach(note => {
      const match = note.innerText.toLowerCase().includes(search);
      note.style.display = match ? "block" : "none";
    });
  }

  window.onload = () => {
    for (let i = 0; i < 3; i++) addNote();
  };
</script>

</body>
</html>
