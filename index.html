
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Стена Идей — BubonPrivet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      overflow-x: hidden;
    }
    header {
      background: #e0e0e0;
      color: #333;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
    }
    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 20px;
    }
    #addNoteBtn {
      padding: 10px 16px;
      background: #d0d0d0;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #searchInput {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 200px;
    }
    #board {
      display: flex;
      overflow-x: auto;
      padding: 20px;
      min-height: 200px;
      gap: 10px;
    }
    .note {
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
      cursor: move;
      width: 200px;
      min-height: 80px;
      flex-shrink: 0;
    }
    .panel {
      background: #ffffff;
      padding: 20px;
      border-top: 1px solid #ddd;
    }
    .panel h2 {
      color: #666;
    }
    .tool {
      margin-bottom: 20px;
    }
    .tool button {
      padding: 8px 16px;
      background: #cccccc;
      color: #222;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
    }
    .tool p {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
      min-height: 40px;
    }
  </style>
</head>
<body>

<header>СТЕНА ИДЕЙ + ПАНЕЛЬ ГЕНИЯ</header>

<div id="controls">
  <button id="addNoteBtn" onclick="addNote()">Добавить идею</button>
  <input type="text" id="searchInput" placeholder="Поиск по идеям..." oninput="searchNotes()">
</div>

<div id="board"></div>

</body>
</html>
