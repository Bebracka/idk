
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ — Идеи</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; background: #fafafa; padding: 20px; }
    h1 { text-align: center; }
    .idea { background: white; margin: 10px auto; padding: 10px 15px; max-width: 600px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    small { color: #888; display: block; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Все идеи</h1>
  <div id="list"></div>
  <script>
    const firebaseConfig = {
      apiKey: "ВСТАВЬ_СЮДА",
      authDomain: "ВСТАВЬ_СЮДА",
      databaseURL: "ВСТАВЬ_СЮДА",
      projectId: "ВСТАВЬ_СЮДА",
      storageBucket: "ВСТАВЬ_СЮДА",
      messagingSenderId: "ВСТАВЬ_СЮДА",
      appId: "ВСТАВЬ_СЮДА"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const list = document.getElementById("list");
    db.ref("ideas").on("value", (snapshot) => {
      const ideas = snapshot.val();
      list.innerHTML = "";
      if (ideas) {
        Object.values(ideas).sort((a,b) => b.time - a.time).forEach(item => {
          const div = document.createElement("div");
          div.className = "idea";
          div.innerHTML = item.text + '<small>' + new Date(item.time).toLocaleString() + '</small>';
          list.appendChild(div);
        });
      }
    });
  </script>
</body>
</html>
